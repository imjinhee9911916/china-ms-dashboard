<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🔒 보호된 페이지</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#102d37;background-image:radial-gradient(circle at 50% 0%,#1c4652 0%,#102d37 60%);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#eef4f5;padding:24px}
  .card{width:100%;max-width:360px;background:#ffffff;color:#172c39;border-radius:14px;
        padding:32px 28px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
  .lock{font-size:34px;line-height:1;margin-bottom:14px}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:-.4px}
  p.desc{margin:0 0 22px;font-size:13px;color:#73818b}
  label{display:block;text-align:left;font-size:12px;font-weight:700;color:#44555f;margin-bottom:6px}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #d8e0e4;border-radius:8px;
        outline:none;background:#f8fafb;color:#172c39;transition:border-color .15s,background .15s}
  input:focus{border-color:#007c78;background:#fff}
  button{width:100%;margin-top:14px;padding:13px;font-size:15px;font-weight:700;color:#fff;
         background:#007c78;border:0;border-radius:8px;cursor:pointer;transition:background .15s}
  button:hover:not(:disabled){background:#006663}
  button:disabled{opacity:.6;cursor:default}
  .msg{min-height:20px;margin-top:12px;font-size:13px;color:#cf635e}
  .msg.info{color:#73818b}
  .foot{margin-top:18px;font-size:11px;color:#9aa8b1}
</style>
</head>
<body>
<div class="card">
  <div class="lock" aria-hidden="true">🔒</div>
  <h1>보호된 페이지</h1>
  <p class="desc">이 페이지는 비밀번호로 암호화되어 있습니다.</p>
  <form id="f" autocomplete="off">

    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password"
           placeholder="비밀번호를 입력하세요" autofocus required>
    <button id="go" type="submit">열기</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  var msg = document.getElementById('msg'), input = document.getElementById('pw'), btn = document.getElementById('go');
  function b64(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return atob(s);
  }
  function bytes(str) {
    var s = atob(str), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  async function unlock(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },

    return new TextDecoder('utf-8').decode(plain);
  }
  document.getElementById('f').addEventListener('submit', async function (e) {

    try {
